# Publishes the simulator (/) and the Brussels optimiser map (/optimiser/) with GitHub Pages on every push to main.
name: Publish simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check both pages reproduce their Python models
        run: |
          pip install mini-racer pandas "pulp==2.9.0"
          python src/check_simulator.py
          python src/optimiser/check_page.py
      - name: Copy the built pages into the site folder
        run: |
          mkdir -p public/optimiser
          cp simulator/index.html public/index.html
          cp optimiser/index.html public/optimiser/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
